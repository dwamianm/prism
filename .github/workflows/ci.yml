name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same pull request cancels the run still in progress, so
# a rebased Dependabot branch or a quick follow-up commit does not pay for two
# full runs. Runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The full suite runs on every core of the runner (pytest-xdist). Work
# stealing keeps the workers busy while a few long tests finish, and each
# worker gets its own PostgreSQL database (tests/conftest.py). The 25
# slowest tests are listed at the end of each run, so a new slow test shows
# up in the log.
#
# tests/test_lexical_shutdown.py runs on its own, on one core, right after
# the parallel run (SERIAL_TESTS). It deletes an index directory right
# after closing it, and tantivy-py can write one lock file a moment after an
# index opens, from a reader it builds inside Index() (#417). Under the load
# of four workers that late write made the delete fail on main. On one core,
# as before the suite went parallel, it passes.
env:
  SERIAL_TESTS: tests/test_lexical_shutdown.py
  PYTEST_PARALLEL: -n auto --dist worksteal --durations=25 --ignore=tests/test_lexical_shutdown.py

# Dependabot's pull requests test one Python version instead of every version
# in the matrix, and skip the simulations job, to save Actions minutes on
# dependency bumps. The full matrix still runs on main after the merge.
jobs:
  test-duckdb:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ${{ fromJSON(github.event.pull_request.user.login == 'dependabot[bot]' && '["3.12"]' || '["3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: latest-known

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --dev --extra api --extra mcp --extra privacy --extra langchain --extra llamaindex

      - name: Install ffmpeg (video tests of RFC-0018 observe())
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Free runner disk (#407)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Run tests (DuckDB)
        run: uv run --no-sync python -m pytest tests/ -q $PYTEST_PARALLEL

      - name: Run tests that need one core (DuckDB)
        run: uv run --no-sync python -m pytest $SERIAL_TESTS -q
      - name: Show disk use after the tests (#407)
        if: always()
        run: |
          df -h / | tail -1
          du -sh /tmp/pytest-of-runner 2>/dev/null || true

      - name: Check public client types
        run: uv run --no-sync mypy --follow-imports=silent --ignore-missing-imports --strict tests/typing/public_api.py

  test-postgres:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ${{ fromJSON(github.event.pull_request.user.login == 'dependabot[bot]' && '["3.12"]' || '["3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: latest-known

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --dev --extra postgres --extra api --extra mcp --extra privacy --extra langchain --extra llamaindex

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      # A newer runner image can carry client tools newer than the PostgreSQL
      # 16 server in docker-compose.yml. A newer pg_dump writes settings that
      # server rejects, such as "transaction_timeout". Install the client that
      # matches the server and put it first on PATH.
      - name: Use the PostgreSQL 16 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Free runner disk (#407)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Run tests (PostgreSQL)
        env:
          PRME_TEST_DATABASE_URL: postgresql://prme_test:prme_test@127.0.0.1:5432/prme_test
        run: uv run --no-sync python -m pytest tests/ -q $PYTEST_PARALLEL

      - name: Run tests that need one core (PostgreSQL)
        env:
          PRME_TEST_DATABASE_URL: postgresql://prme_test:prme_test@127.0.0.1:5432/prme_test
        run: uv run --no-sync python -m pytest $SERIAL_TESTS -q
      - name: Show disk use after the tests (#407)
        if: always()
        run: |
          df -h / | tail -1
          du -sh /tmp/pytest-of-runner 2>/dev/null || true

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down

  # uv.lock pins what the other jobs test, so a fresh `pip install prme`,
  # which resolves the newest allowed versions, was untested (#377). This job
  # resolves the newest allowed dependencies and runs the whole suite on
  # DuckDB and PostgreSQL. The lock file stays unchanged, so the recorded
  # benchmark caches still replay against the locked versions.
  test-newest-dependencies:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: latest-known

      - name: Set up Python
        run: uv python install 3.13

      - name: Install the newest allowed dependencies
        run: uv sync --python 3.13 --upgrade --dev --extra postgres --extra api --extra mcp --extra privacy --extra langchain --extra llamaindex

      - name: Show the resolved versions
        run: uv pip list --python .venv/bin/python | grep -i -E '^(duckdb|openai|anthropic|instructor|pydantic|fastapi|mcp|asyncpg) '

      - name: Install ffmpeg (video tests of RFC-0018 observe())
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      # A newer runner image can carry client tools newer than the PostgreSQL
      # 16 server in docker-compose.yml. A newer pg_dump writes settings that
      # server rejects, such as "transaction_timeout". Install the client that
      # matches the server and put it first on PATH.
      - name: Use the PostgreSQL 16 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Free runner disk (#407)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Run tests (DuckDB and PostgreSQL)
        env:
          PRME_TEST_DATABASE_URL: postgresql://prme_test:prme_test@127.0.0.1:5432/prme_test
        run: uv run --no-sync python -m pytest tests/ -q $PYTEST_PARALLEL

      - name: Run tests that need one core (DuckDB and PostgreSQL)
        env:
          PRME_TEST_DATABASE_URL: postgresql://prme_test:prme_test@127.0.0.1:5432/prme_test
        run: uv run --no-sync python -m pytest $SERIAL_TESTS -q
      - name: Show disk use after the tests (#407)
        if: always()
        run: |
          df -h / | tail -1
          du -sh /tmp/pytest-of-runner 2>/dev/null || true

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down

  lint:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: latest-known

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --dev

      - name: Run ruff
        run: uv run ruff check src/ tests/

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify installed wheel
        run: |
          uv pip install --python .venv/bin/python --reinstall dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          import importlib.metadata as metadata
          from pathlib import Path

          import prme

          package = Path(prme.__file__).parent
          assert metadata.version("prme") == prme.__version__
          assert (package / "py.typed").is_file()
          PY

  simulations:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: latest-known

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --dev

      - name: Run simulations
        run: uv run python -m scripts.run_simulations

      # The retrieval defaults before rank fusion and the reader format became
      # the defaults (v0.12.0) must also pass every checkpoint. A weighted
      # fusion drops the rank fusion recency boost and tie-break, and weighted
      # scoring never applies the rank fusion session decay. Balanced ordering
      # is the default again; naming it keeps this set explicit.
      - name: Run simulations with the previous retrieval defaults
        env:
          PRME_SCORING__FUSION: weighted
          PRME_PACKING__CONTEXT_FORMAT: auditable
          PRME_PACKING__MULTIPATH_ORDERING: balanced
        run: uv run python -m scripts.run_simulations

  test-integrations:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ${{ fromJSON(github.event.pull_request.user.login == 'dependabot[bot]' && '["3.13"]' || '["3.11", "3.13"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: latest-known

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install integration dependencies
        run: >-
          uv sync --python ${{ matrix.python-version }} --dev
          --extra langchain --extra llamaindex

      - name: Run framework integration tests
        run: >-
          uv run --no-sync python -m pytest
          tests/test_integration_chat_history.py
          tests/test_integrations_langchain.py
          tests/test_integrations_llamaindex.py -q
