# Local development and CI test database only. The prme_test credentials are
# fixed test values, so the port is published on the loopback interface only.
# Do not publish this service on a network address; a PostgreSQL that other
# machines can reach needs its own credentials (see documentation/deployment.md).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: prme_test
      POSTGRES_PASSWORD: prme_test
      POSTGRES_DB: prme_test
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prme_test -d prme_test"]
      interval: 5s
      timeout: 5s
      retries: 5
