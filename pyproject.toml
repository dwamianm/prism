[project]
name = "prme"
version = "0.16.0a9"
description = "Portable Relational Memory Engine - local-first memory substrate for LLM-powered systems"
readme = "README.md"
authors = [
    { name = "Dwamian McLeish", email = "dwamian@journey.ly" }
]
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
keywords = ["memory", "llm", "ai", "knowledge-graph", "vector-search", "event-sourcing", "duckdb", "agents", "rag", "long-term-memory", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
    "duckdb>=1.4.0",
    "usearch>=2.26.2",
    "tantivy>=0.22.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.9",
    "fastembed>=0.7.4",
    "structlog",
    "pytz>=2025.2",
    "instructor>=1.14",
    "openai>=2.20",
    "anthropic>=0.80",
    "ollama>=0.6",
    "dateparser>=1.2",
    "cryptography==50.0.2",
    "filelock>=3.16",
    "fsspec==2026.2.0",
    "httpx>=0.27",
    "tiktoken>=0.12",
    "numpy>=1.26",
    "pillow>=10.1",
]

[project.urls]
Homepage = "https://github.com/dwamianm/prism"
Documentation = "https://github.com/dwamianm/prism/tree/main/docs"
Repository = "https://github.com/dwamianm/prism"
Issues = "https://github.com/dwamianm/prism/issues"
Changelog = "https://github.com/dwamianm/prism/blob/main/CHANGELOG.md"

[project.scripts]
prme = "prme.cli:main"
prme-mcp = "prme.mcp:main"

[project.optional-dependencies]
local-privacy = [
    "keyring==25.7.0",
]
privacy = [
    "presidio-analyzer==2.2.364; python_version < '3.15'",
    "spacy==3.8.11; python_version < '3.15'",
]
postgres = [
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
mcp = [
    "mcp>=1.26.0,<2",
]
reranker = [
    "sentence-transformers>=4.0",
]
verification = [
    "sentence-transformers>=4.0",
]
langchain = [
    "langchain-core>=0.3",
]
llamaindex = [
    "llama-index-core>=0.12",
]
evaluation = [
    "tiktoken>=0.12",
]

[dependency-groups]
dev = [
    # The sanitizer's spaCy model is a direct URL, which PyPI refuses in published metadata, so it is a
    # development dependency and users install it themselves (docs/SANITIZATION.md).
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl ; python_version < '3.15'",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "scipy==1.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "stress: load and stress tests (deselect with '-m not stress')",
]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
